# Builds cross-platform release binaries with the shared OAuth client
# credentials injected from repository secrets, and publishes them to a
# GitHub release along with a checksums.txt manifest (verified by
# install.sh). Requires the GUPPY_CLIENT_ID and GUPPY_CLIENT_SECRET
# repository secrets. Trigger by pushing a tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Verify
        run: |
          go vet ./...
          go test ./... -count=1

      # Single job building every target: guppy is pure Go (no cgo), so
      # cross-compilation is cheap and this avoids release-creation races.
      - name: Build binaries
        env:
          GUPPY_CLIENT_ID: ${{ secrets.GUPPY_CLIENT_ID }}
          GUPPY_CLIENT_SECRET: ${{ secrets.GUPPY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${GUPPY_CLIENT_ID:-}" ] || [ -z "${GUPPY_CLIENT_SECRET:-}" ]; then
            echo "::error::set the GUPPY_CLIENT_ID and GUPPY_CLIENT_SECRET repository secrets first"
            exit 1
          fi

          ldflags="-s -w -X guppy/internal/auth.embeddedClientID=${GUPPY_CLIENT_ID} -X guppy/internal/auth.embeddedClientSecret=${GUPPY_CLIENT_SECRET}"
          mkdir -p dist

          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "==> ${goos}/${goarch}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$ldflags" -o guppy .
            tar -czf "dist/guppy_${GITHUB_REF_NAME}_${goos}_${goarch}.tar.gz" guppy
            rm guppy
          done

          # install.sh verifies downloads against this manifest.
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
